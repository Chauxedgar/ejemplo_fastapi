<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Nodos Servidores Registrados</h2>
    <!-- Botón para abrir modal o ir a formulario de creación -->
    <button class="btn btn-success" (click)="abrirModalCrear()">
      + Nuevo Servidor
    </button>
  </div>

  <div class="row" *ngIf="servidores.length > 0; else sinServidores">
    <div class="col-md-4 mb-4" *ngFor="let s of servidores">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title text-primary fw-bold">{{ s.nombre_host }}</h5>
            <h6 class="card-subtitle mb-2 text-muted font-monospace">{{ s.direccion_ip }}</h6>
            <hr>
            <p class="card-text mb-1">
              <strong>Estado: </strong>
              <span class="badge" [ngClass]="s.en_produccion ? 'bg-success' : 'bg-warning text-dark'">
                {{ s.en_produccion ? 'Producción' : 'Mantenimiento' }}
              </span>
            </p>
            <p class="card-text mb-3">
              <small class="text-muted">Motor: {{ s.motor_contenedores_display || s.motor_contenedores }}</small>
            </p>
          </div>
          
          <!-- Botones de Acción -->
          <div class="d-grid gap-2">
            <a [routerLink]="['/servidor', s.id]" class="btn btn-outline-primary btn-sm">
              Ver Ficha y Alertas
            </a>
            <button class="btn btn-outline-danger btn-sm" (click)="eliminar(s.id)">
              Eliminar Servidor
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <ng-template #sinServidores>
    <div class="alert alert-info text-center py-4">
      <h5>No hay servidores registrados</h5>
    </div>
  </ng-template>
</div>
